# CodeTrackr demo environment on one AWS EC2 server (Docker Compose).
#
#   web    Caddy: the built website, HTTPS, and /api + /auth forwarded to the API
#   api    the Express API image (backend/Dockerfile)
#   mongo  MongoDB 7, data kept in a volume
#   prometheus  scrapes the API's /metrics every 15 s, keeps 7 days
#   grafana     the "CodeTrackr API" dashboard at /grafana, read-only for visitors
#
# DEMO ENVIRONMENT: seeded with invented demo data, and everyone is signed in as the
# demo user (AUTH_BYPASS). It never touches the production database or real users.
# The production site runs on Render + Vercel + MongoDB Atlas.
#
# Needs, next to this file (never committed): a .env with SITE_ADDRESS, JWT_SECRET, METRICS_TOKEN
# and GRAFANA_ADMIN_PASSWORD, and a metrics_token file holding the same METRICS_TOKEN.
# Deployed by .github/workflows/aws-deploy.yml.

services:
  mongo:
    image: mongo:7
    command: ["--wiredTigerCacheSizeGB", "0.25"] # the server has 1 GB of memory
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    image: codetrackr-api:latest
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017/codetrackr
      MONGO_TLS: "false"
      PORT: "5050"
      FRONTEND_URL: https://${SITE_ADDRESS}
      NODE_ENV: development # demo only: lets AUTH_BYPASS run (it is refused in production)
      AUTH_BYPASS: "true"
      JWT_SECRET: ${JWT_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN}
      GOOGLE_CLIENT_ID: demo
      GOOGLE_CLIENT_SECRET: demo
      GOOGLE_CALLBACK_URL: https://${SITE_ADDRESS}/auth/google/callback
    command: ["sh", "-c", "node scripts/seed-local.js && node app.js"]
    restart: unless-stopped

  web:
    image: codetrackr-web:latest
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus-data:/prometheus
    mem_limit: 200m
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.3.1
    environment:
      GF_SERVER_ROOT_URL: https://${SITE_ADDRESS}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true" # visitors can look, not change
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/codetrackr.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 200m
    restart: unless-stopped

volumes:
  mongo-data:
  caddy-data:
  prometheus-data:
  grafana-data:
