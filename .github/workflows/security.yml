name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: '0 4 * * 1' # every Monday: new advisories appear without new commits

permissions:
  contents: read

jobs:
  # Known vulnerabilities in the packages that ship (dev tools excluded). High or critical fails the build.
  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [backend, frontend, extension]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.dir }}

  # Committed keys, tokens or passwords, across the whole history.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
